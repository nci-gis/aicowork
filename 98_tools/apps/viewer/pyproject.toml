[project]
name = "aicowork-viewer"
version = "0.0.1rc4"
description = "AI-Cowork local viewer: dashboard, search, calendar, light editing. Loopback only. Built on the shared library aicowork_core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }   # 98_tools/LICENSE
dependencies = [
    "aicowork-core",                 # the shared library; the viewer never imports the aicowork app
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.52,<0.53",
    "markdown>=3.10,<3.11",
]

[tool.uv.sources]
aicowork-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore::DeprecationWarning:fastapi.*"]

