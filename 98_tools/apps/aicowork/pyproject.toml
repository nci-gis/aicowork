[project]
name = "aicowork"
version = "0.0.1rc5"
description = "AI-Cowork command line: create and check an instance, egress gate, upgrade. Standard library only (plus aicowork-core)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }   # 98_tools/LICENSE
dependencies = ["aicowork-core"]   # the shared library (standard library only); nothing else, by design

[project.optional-dependencies]
seal = ["cryptography>=50,<51"]   # only for `below: encrypt`; without it the CLI refuses to encrypt

[tool.uv.sources]
aicowork-core = { workspace = true }

[project.scripts]
aicowork = "aicowork.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicowork"]

[tool.pytest.ini_options]
testpaths = ["tests"]
